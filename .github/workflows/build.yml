name: Build and test
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['package']['version']
          expected = f'v{version}'
          if os.environ['RELEASE_TAG'] != expected:
              raise SystemExit(f'Release tag must match Cargo.toml: expected {expected}')
          PY

  unix:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: macos-15-intel
            arch: x86_64
          - os: macos-14
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libarchive-dev pkg-config xvfb bubblewrap cmake ninja-build
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install gtk4 libadwaita libarchive pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix libarchive)/lib/pkgconfig" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release --workspace
      - run: cargo test --locked -p qit-core recommendations_fetch_creator_from_selected_mirror -- --ignored
      - run: cargo test --locked -p qit-core required_windows_compilers_load_without_optional_recommendations -- --ignored
      - name: HTTP integration tests
        run: |
          QIT_CLI="$PWD/target/release/qit-cli" python3 tests/protocol.py
          QIT_CLI="$PWD/target/release/qit-cli" python3 tests/extend.py
      # Linux GUI smoke remains a local test: hosted runners deny bwrap UID mapping.
      - name: macOS GUI smoke
        if: runner.os == 'macOS'
        run: QIT_DATA_DIR="$RUNNER_TEMP/qit-smoke" QIT_SMOKE_EXIT_SECONDS=3 target/release/qit
      - run: python3 tests/package.py
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          curl -fL "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${{ matrix.arch }}.AppImage" -o "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"
          python3 scripts/package.py --appimagetool "$RUNNER_TEMP/appimagetool"
      - name: Package macOS
        if: runner.os == 'macOS'
        run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: qit-${{ runner.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  windows:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            msystem: UCRT64
            prefix: mingw-w64-ucrt-x86_64
            arch: x86_64
          - os: windows-11-arm
            msystem: CLANGARM64
            prefix: mingw-w64-clang-aarch64
            arch: aarch64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            ${{ matrix.prefix }}-rust
            ${{ matrix.prefix }}-gtk4
            ${{ matrix.prefix }}-libadwaita
            ${{ matrix.prefix }}-libarchive
            ${{ matrix.prefix }}-pkgconf
            ${{ matrix.prefix }}-python
            ${{ matrix.prefix }}-binutils
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release --workspace
      - run: cargo test --locked -p qit-core recommendations_fetch_creator_from_selected_mirror -- --ignored
      - run: cargo test --locked -p qit-core required_windows_compilers_load_without_optional_recommendations -- --ignored
      - name: HTTP integration tests
        run: QIT_CLI="$(cygpath -m "$PWD/target/release/qit-cli.exe")" python tests/protocol.py
      - name: GUI smoke
        run: QIT_DATA_DIR="$(cygpath -m "$RUNNER_TEMP/qit-smoke")" QIT_SMOKE_EXIT_SECONDS=3 target/release/qit.exe
      - run: python tests/package.py
      - name: Package
        run: python scripts/package.py --prefix "$(cygpath -m "$MINGW_PREFIX")"
      - uses: actions/upload-artifact@v4
        with:
          name: qit-Windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [unix, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qit-*
          path: dist
          merge-multiple: true
      - name: Verify assets and generate checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          version = os.environ['RELEASE_TAG'][1:]
          expected = {
              f'Qit-{version}-{system}-{arch}.{extension}'
              for system, extension in [('linux', 'AppImage'), ('darwin', 'dmg'), ('windows', 'zip')]
              for arch in ['x86_64', 'aarch64']
          }
          folder = Path('dist')
          actual = {p.name for p in folder.iterdir() if p.is_file()}
          if actual != expected:
              raise SystemExit(f'Unexpected release assets: missing={expected - actual}, extra={actual - expected}')
          checksums = []
          for name in sorted(expected):
              with (folder / name).open('rb') as source:
                  checksum = hashlib.file_digest(source, 'sha256').hexdigest()
              checksums.append(f'{checksum}  {name}\n')
          (folder / 'SHA256SUMS').write_text(''.join(checksums))
          PY
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease=true
          fi
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes \
              --title "Qit $RELEASE_TAG" --prerelease="$prerelease"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease"
